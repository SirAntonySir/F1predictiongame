name: predictiongame
description: "F1 prediction game."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  go_router: ^14.6.1
  google_fonts: ^6.2.1
  shared_preferences: ^2.3.3
  intl: ^0.19.0
  url_launcher: ^6.3.1
  package_info_plus: ^8.1.2
  flutter_secure_storage: ^9.2.4
  fl_chart: ^0.69.0
  flutter_local_notifications: ^21.0.0
  timezone: ^0.11.0
  flutter_timezone: ^5.1.0
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.5
  skeletonizer: ^2.1.3
  font_awesome_flutter: ^11.0.0
  file_picker: ^8.1.4
  share_plus: ^10.1.2
  path_provider: ^2.1.5
  flutter_svg: ^2.0.10+1
  # Parses SVG path `d=` data into ui.Path (same parser flutter_svg uses).
  # Powers the stroke-draw splash animation in components/painted_splash.dart.
  path_parsing: ^1.1.0
  country_flags: ^3.2.0
  flutter_dynamic_icon_plus: ^1.4.1

# path_provider_foundation 2.6.0 switched to FFI via package:objective_c,
# whose dylib fails to load on the iOS 26 simulator (dlopen can't resolve
# 'objective_c.framework/objective_c'; flutter/flutter#181382 family).
# 2.5.1 is the last CocoaPods-based release. Drop this once a fixed
# path_provider_foundation ships.
dependency_overrides:
  path_provider_foundation: 2.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/avatar/
    - assets/avatar/icons/
  fonts:
    # Stampete by JOEBOB graphics — shareware, non-commercial use only.
    # Used by ticket data cells (driver codes + points) to give the picks a
    # rubber-stamped paper-ticket feel.
    - family: Stampete
      fonts:
        - asset: assets/fonts/Stampete.ttf
