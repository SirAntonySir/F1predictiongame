databases:
  - name: f1pg-db
    plan: basic-256mb
    postgresMajorVersion: 16

services:
  - type: web
    name: f1pg-backend
    runtime: node
    plan: starter
    rootDir: backend
    # --include=dev so the build can see @types/node-cron + xlsx (devDeps).
    # NODE_ENV=production would otherwise make npm skip them.
    buildCommand: npm ci --include=dev && npm run build && npm run db:migrate
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: f1pg-db
          property: connectionString
      - key: ADMIN_TOKEN
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: JOLPICA_BASE
        value: https://api.jolpi.ca/ergast
      - key: WIKIPEDIA_BASE
        value: https://en.wikipedia.org
      # Firebase service-account JSON (one line) for FCM sends. Secret — set the
      # value in the Render dashboard, not here. Unset → dispatcher skips sending.
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false

  # Vite/React admin panel. Static site — no plan (free), no start/health command.
  # Auth is the backend's shared ADMIN_TOKEN, entered in-app (X-Admin-Token).
  - type: web
    name: f1pg-admin
    runtime: static
    rootDir: admin
    # No NODE_ENV=production here, so `npm ci` keeps the devDeps (vite, tsc)
    # the build needs — unlike the backend service above.
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      # Baked into the bundle at build time (Vite VITE_* convention), so it must
      # be present before buildCommand runs. Points the admin UI at the backend.
      - key: VITE_API_URL
        value: https://f1pg-backend.onrender.com
    routes:
      # SPA: react-router does client-side routing, so a direct hit / reload on
      # any deep link (e.g. /leagues) must serve index.html instead of 404ing.
      - type: rewrite
        source: /*
        destination: /index.html
