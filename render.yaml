databases:
  - name: f1pg-db
    plan: basic-256mb
    postgresMajorVersion: 16

services:
  - type: web
    name: f1pg-backend
    runtime: node
    plan: starter
    rootDir: backend
    # --include=dev so the build can see @types/node-cron + xlsx (devDeps).
    # NODE_ENV=production would otherwise make npm skip them.
    buildCommand: npm ci --include=dev && npm run build && npm run db:migrate
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: f1pg-db
          property: connectionString
      - key: ADMIN_TOKEN
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: JOLPICA_BASE
        value: https://api.jolpi.ca/ergast
      - key: WIKIPEDIA_BASE
        value: https://en.wikipedia.org
      # Firebase service-account JSON (one line) for FCM sends. Secret — set the
      # value in the Render dashboard, not here. Unset → dispatcher skips sending.
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
